name: Publish
run-name: Publish changed npm packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@8a7496fd44e8a1b0a88a7459e36213b2fefc1d15
        with:
          node-version: '24'
          cache: true
          run-install: false
      - name: Plan release and synchronize versions
        id: plan
        run: node .github/scripts/plan-npm-publish.mjs --apply
      - name: Install the bumped workspace
        if: steps.plan.outputs.releases != '[]'
        run: vp install --frozen-lockfile
      - name: Verify the bumped workspace
        if: steps.plan.outputs.releases != '[]'
        run: vp run ready
      - name: Revalidate published versions
        if: steps.plan.outputs.releases != '[]'
        env:
          EXPECTED_RELEASES: ${{ steps.plan.outputs.releases }}
        run: node .github/scripts/plan-npm-publish.mjs
      - name: Verify npm trusted publishing for every package
        if: steps.plan.outputs.releases != '[]'
        env:
          RELEASES: ${{ steps.plan.outputs.releases }}
        run: node .github/scripts/check-npm-publishing.mjs
      - name: Commit the verified version changes
        if: steps.plan.outputs.releases != '[]'
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.plan.outputs.releases }}
          FILES: ${{ steps.plan.outputs.files }}
        run: node .github/scripts/commit-npm-publish.mjs
      - name: Use version commit as the npm source revision
        if: steps.plan.outputs.releases != '[]'
        env:
          VERSION_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch origin "$VERSION_COMMIT"
          git reset --mixed "$VERSION_COMMIT"
      - name: Publish changed packages in dependency order
        if: steps.plan.outputs.releases != '[]'
        env:
          RELEASES: ${{ steps.plan.outputs.releases }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          for (const { name, directory, version } of JSON.parse(process.env.RELEASES)) {
            execFileSync('npm', ['publish', '--access', 'public', '--provenance'], { cwd: directory, stdio: 'inherit' })
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nPublished **${name}@${version}** to npm.\n`)
          }
          NODE
